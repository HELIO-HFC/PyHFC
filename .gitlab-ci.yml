# GitLab CI pipeline of pyhfc.
#
# Pipelines only run when they are triggered:
#   - from the GitLab web interface (Build > Pipelines > Run pipeline),
#   - through the API (POST /projects/:id/pipeline or a trigger token),
#   - when a tag is pushed (a release tag pushed on master is published on PyPI).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_COMMIT_TAG
    - when: never

stages:
  - lint
  - test
  - build
  - publish

variables:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  PRE_COMMIT_HOME: "$CI_PROJECT_DIR/.pre-commit-cache"
  # Use the Python of the Docker image, not a uv-managed one
  UV_PYTHON_DOWNLOADS: never

default:
  image: ghcr.io/astral-sh/uv:python3.14-bookworm
  interruptible: true
  cache:
    - key:
        files: [uv.lock]
        prefix: uv-$CI_JOB_NAME
      paths: [.uv-cache]
  after_script:
    - uv cache prune --ci

pre-commit:
  stage: lint
  variables:
    # the uv-lock hook would try to update the lock file
    SKIP: uv-lock
  cache:
    - key:
        files: [uv.lock]
        prefix: uv-$CI_JOB_NAME
      paths: [.uv-cache]
    - key:
        files: [.pre-commit-config.yaml]
        prefix: pre-commit
      paths: [.pre-commit-cache]
  script:
    - uv lock --check
    - uv sync --frozen
    - uv run --frozen pre-commit run --all-files --show-diff-on-failure

test:
  stage: test
  image: ghcr.io/astral-sh/uv:python$PYTHON_VERSION-bookworm
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.12", "3.13", "3.14"]
  before_script:
    # A virtual X server is needed to run the Tk GUI tests
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends xvfb xauth > /dev/null
  script:
    - uv sync --frozen
    - xvfb-run -a uv run --frozen pytest --junitxml=report-$PYTHON_VERSION.xml
      --cov --cov-report=term --cov-report=xml
  # Coverage shown in the merge requests and by the GitLab coverage badge
  coverage: '/^TOTAL\s.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      junit: report-$PYTHON_VERSION.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Tests querying the live HFC web service: they may fail if the service is down.
test-network:
  stage: test
  allow_failure: true
  script:
    - uv sync --frozen
    - uv run --frozen pytest -m network --junitxml=report-network.xml
  artifacts:
    when: always
    reports:
      junit: report-network.xml

build:
  stage: build
  needs: [test]
  script:
    - uv build
  artifacts:
    paths: [dist/]

# Publish the package on PyPI when a release tag (vX.Y.Z) is pushed on master.
# It uses PyPI trusted publishing: no token is stored, PyPI trusts this
# pipeline (see the "Releases" section of the README for its configuration).
publish-pypi:
  stage: publish
  needs: [build]
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    # the full history is needed to check that the tag is on master
    GIT_DEPTH: 0
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  environment:
    name: pypi
    url: https://pypi.org/project/pyhfc/
  script:
    - sh ci/check-release.sh "$CI_COMMIT_TAG" "$CI_COMMIT_SHA"
    - uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*
